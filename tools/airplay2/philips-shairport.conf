// Separate test receiver. The existing Android mirroring app stays installed.
general = {
    name = "Philips AirPlay 2 (test)";
    output_backend = "pulseaudio";
    mdns_backend = "avahi";
    port = 7100;
    // Calibrate on the target: negative values deliver audio earlier.
    // Keep the device's measured/listening-test value in its private config.
    audio_backend_latency_offset_in_seconds = 0.0;
};
pulseaudio = {
    server = "unix:/run/pulse/native";
    sink = "android_airplay";
    application_name = "Shairport Sync AirPlay 2";
    output_rate = 48000;
    output_format = "S16_LE";
    output_channels = 2;
};

diagnostics = { log_verbosity = 1; statistics = "yes"; };
